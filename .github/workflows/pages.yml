# Deploy aplikasi statis ke GitHub Pages (GRATIS untuk repo public).
#
# Yang dibangun adalah mirror `Deploy Github/` — bukan akar repo — karena
# mirror inilah yang memang disiapkan untuk hosting statis (tanpa `server/`).
# `vite.config.ts` memakai `base: "./"` supaya aset tetap ketemu di bawah
# path project site `/Auto-Generator-Office/`.
#
# Catatan: DeckCraft Studio butuh API Node lokal; di Pages panel itu akan
# menampilkan "tidak tersedia". Fitur lain (editor, ekspor browser, tema PPT)
# berjalan penuh karena seluruhnya sisi klien.

name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # Folder tempat Vite membangun hasil akhir.
      - "Deploy Github/**"
      # Konfigurasi build Vite (ada di akar + di-copy ke mirror saat sync).
      - "vite.config.ts"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
      # Konfigurasi Docker (Dockerfile/docker-compose tidak mengubah build
      # tapi perlu trigger agar dokumentasi Docker di README/INSTALL ikut update).
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      # README + INSTALL di-root (di-copy ke mirror saat sync).
      - "README.md"
      - "INSTALL.md"
      # Workflow itu sendiri.
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build situs statis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm sengaja dipakai di sini (bukan pnpm): mirror punya lockfile
      # sendiri dan `cache: pnpm` memicu pembacaan workspace akar repo.
      - name: Pasang dependensi
        working-directory: "Deploy Github"
        env:
          # Puppeteer hanya dipakai skrip verifikasi lokal, bukan build web.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Vite
        working-directory: "Deploy Github"
        run: npm run build

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Deploy Github/dist"

  deploy:
    name: Terbitkan ke Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
