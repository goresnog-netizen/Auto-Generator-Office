name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Batalkan eksekusi lama kalau ada commit baru di branch yang sama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck + unit test + build: bagian yang sepenuhnya lintas-platform.
  check:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (browser)
        run: pnpm exec tsc --noEmit

      - name: Typecheck (server)
        run: pnpm exec tsc --noEmit -p tsconfig.server.json

      - name: Typecheck (node)
        run: pnpm exec tsc --noEmit -p tsconfig.node.json

      - name: Unit test
        run: pnpm exec vitest run --reporter=dot

      - name: Build
        run: pnpm exec vite build

  # Generator Node: menulis berkas docx/xlsx/pdf/diagram sungguhan.
  # Tidak butuh DeckCraft binary, jadi aman di runner Linux.
  generators:
    name: Generator menulis berkas nyata
    runs-on: ubuntu-latest
    env:
      # Ubuntu runner sudah membawa Google Chrome. Variabel ini dipakai
      # Puppeteer bila skrip verifikasi tidak membaca config/ di bawah.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `config/puppeteer.config.json` sengaja TIDAK di-commit (berisi path
      # Chrome milik mesin pengembang). Tanpa berkas ini mermaid-cli jatuh ke
      # fallback .mmd, dan verifikasi diagram gagal membaca SVG.
      - name: Siapkan Chrome untuk mermaid-cli
        run: |
          mkdir -p config
          printf '%s\n' '{"headless":true,"args":["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"],"executablePath":"/usr/bin/google-chrome"}' > config/puppeteer.config.json
          pnpm exec mmdc --version || true

      - name: Generator (struktur & validitas berkas)
        run: node scripts/verifikasi-generators.mjs

      - name: Audit isi generator (konten bermakna)
        run: node scripts/audit-isi-generator.mjs

      - name: Verifikasi gambar tertanam di PDF
        run: node scripts/verifikasi-pdf-gambar.mjs

      - name: Verifikasi fitur baru (CI, undo, pesan, diagram)
        run: node scripts/verifikasi-fitur-baru.mjs

      - name: Verifikasi fitur DeckCraft (font kode, filmstrip, ekspor)
        run: node scripts/verifikasi-fitur-deckcraft.mjs

      - name: Audit isi generator Node (buffer, mono, chart)
        run: node scripts/audit-isi-generator-node.mjs

      - name: Mermaid benar-benar ter-render (bukan fallback .mmd)
        run: node scripts/verifikasi-mermaid.mjs

      - name: Negative test (skrip menangkap regresi)
        run: node scripts/audit-negative-test.mjs

      # Workflow memeriksa dirinya sendiri: YAML valid, semua skrip yang
      # dirujuk ada, semua skrip npm terdaftar. Jadi workflow yang rusak
      # (skrip hilang / nama salah) ketahuan di runner yang sama.
      - name: Workflow memeriksa dirinya sendiri
        run: node scripts/simulasi-ci.mjs --hanya-validasi

  # Perintah DeckCraft dibandingkan dengan engine asli. Butuh binary
  # DeckCraft, jadi khusus runner Windows (binary rilis hanya Windows/Linux
  # — pakai Windows supaya identik dengan mesin pengembangan).
  deckcraft:
    name: Perintah vs engine DeckCraft
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unduh binary DeckCraft
        shell: pwsh
        run: ./scripts/vendor-deckcraft.ps1

      - name: Bandingkan id perintah dengan engine
        run: node scripts/verifikasi-perintah.mjs

      - name: Uji end-to-end bridge DeckCraft
        run: node --experimental-strip-types scripts/verify-deckcraft.mts

      - name: Uji blok kode ber-font monospace
        run: node --experimental-strip-types scripts/verifikasi-kode-deckcraft.mts

  # Membuktikan Dockerfile benar-benar menghasilkan image yang jalan.
  #
  # Ini penting karena Dockerfile tidak bisa diuji di mesin pengembangan
  # berbasis Windows tanpa Docker: URL rilis DeckCraft, ketergantungan glibc
  # (Alpine/musl gagal), dan path binary di dalam arsip hanya bisa
  # dibuktikan di dalam container Linux sungguhan.
  docker:
    name: Image Docker jalan & DeckCraft aktif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nitz-909:ci .

      - name: Jalankan container
        run: |
          docker run -d --name nitz-909-ci -p 8090:8090 nitz-909:ci
          echo "menunggu container siap..."
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8090/ > /dev/null 2>&1; then
              echo "siap setelah ${i} percobaan"
              exit 0
            fi
            sleep 2
          done
          echo "container tidak pernah merespons:"
          docker logs nitz-909-ci
          exit 1

      - name: Halaman utama tersaji
        run: |
          kode=$(curl -s -o /tmp/index.html -w '%{http_code}' http://127.0.0.1:8090/)
          echo "HTTP $kode"
          test "$kode" = "200"
          grep -qi '<div id="root"' /tmp/index.html

      - name: Binary DeckCraft ada dan bisa dijalankan
        run: |
          docker exec nitz-909-ci deckcraft-cli --version
          docker exec nitz-909-ci test -x /usr/local/bin/deckcraft-cli

      - name: API DeckCraft melaporkan tersedia
        run: |
          curl -fsS http://127.0.0.1:8090/api/deckcraft/status | tee /tmp/status.json
          node -e "
            const s = require('/tmp/status.json');
            if (s.tersedia !== true) {
              console.error('DeckCraft TIDAK tersedia di dalam image:', s.galat ?? '(tanpa pesan)');
              process.exit(1);
            }
            console.log('DeckCraft versi', s.versi, '| tema:', (s.tema ?? []).length);
          "

      - name: Log container saat gagal
        if: failure()
        run: docker logs nitz-909-ci || true

      - name: Bersihkan
        if: always()
        run: docker rm -f nitz-909-ci || true
