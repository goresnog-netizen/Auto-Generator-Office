# docker-compose.yml — NitZ-909: Auto Generator Office
#
# Jalankan:
#   docker compose up --build
#
# Setelah container aktif, buka http://localhost:8090
# DeckCraft Studio aktif di container ini (tidak perlu setup tambahan).
#
# Untuk menghentikannya:
#   docker compose down
#
# Catatan:
#   - PORT default 8090 (sama dengan yang dipakai client di browser).
#   - DeckCraft CLI sudah termasuk di image; diunduh saat build dan
#     diverifikasi SHA-256 terhadap SHA256SUMS.txt rilis resmi.
#   - Tidak butuh volume persisten: dokumen tersimpan di browser pengguna.
#   - Healthcheck memakai Node (sudah ada di image), bukan wget/curl.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nitz-909:latest
    container_name: nitz-909
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      HOST: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
