# docker-compose.yml — NitZ-909: Auto Generator Office
#
# Jalankan:
#   docker compose up --build
#
# Setelah container aktif, buka http://localhost:8090
# DeckCraft Studio aktif di container ini (tidak perlu setup tambahan).
#
# Untuk menghentikannya:
#   docker compose down
#
# Catatan:
#   - PORT default 8090 (harus sesuai dengan deklarasi di client).
#   - DeckCraft CLI sudah termasuk di image (download otomatis di Dockerfile).
#   - Tidak butuh volume持久化; semua data di memori browser pengguna.
#   - healthcheck memastikan container siap sebelum open browser.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nitz-909
    ports:
      # host → container
      - "8090:8090"
    environment:
      # Port yang didengarkan server internal
      PORT: "8090"
      HOST: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
